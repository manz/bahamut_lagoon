[project]
name = "bahamut_lagoon"
version = "0.0.0.dev0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a816==1.3.0a3",
    "katsuji==0.6.0a2",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/manz/bahamut_lagoon"

[dependency-groups]
dev = [
    "kintsuki[visual]==0.0.0a21",
    "mypy==2.4.0",
    "pytest",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["utils", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
explicit_package_bases = true
disallow_any_explicit = true
files = ["build.py", "convert.py", "utils", "tests"]

[[tool.mypy.overrides]]
# kintsuki is annotated but ships no py.typed marker yet: read its sources.
module = ["kintsuki", "kintsuki.*"]
follow_untyped_imports = true
