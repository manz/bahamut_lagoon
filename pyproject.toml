[project]
name = "bahamut_lagoon"
version = "0.0.0.dev0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a816==1.2.0",
    "katsuji[render]==0.4.0",
]

[project.urls]
Homepage = "https://github.com/manz/bahamut_lagoon"

[dependency-groups]
dev = [
    "kintsuki[visual]==0.0.0a21",
    "mypy==2.4.0",
    "pytest",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["utils", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
explicit_package_bases = true
disallow_any_explicit = true
files = ["build.py", "build_room.py", "convert.py", "generate_macros.py", "utils", "tests"]

[[tool.mypy.overrides]]
# a816's script/ and kintsuki are annotated but ship no py.typed marker yet: read their sources.
module = ["script", "script.*", "kintsuki", "kintsuki.*"]
follow_untyped_imports = true
