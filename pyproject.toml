[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bahamut_lagoon"
version = "0.0.0.dev0"
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
]

dependencies = ["a816", "pillow", "numpy"]

[project.urls]
Homepage = "https://github.com/manz/a816"

[tool.hatch.version]
source = "env"
variable = "VERSION"

[tool.hatch.envs.tests]
extra-dependencies = [
    "black==23.7.0",
    "pytest",
    "ruff"
]

          [tool.hatch.build.targets.wheel]
      packages = ["src/foo"]

[tool.hatch.envs.tests.scripts]
check_format = "black --check utils build.py --color --diff"
format = "black -l120 build.py utils"
tests = "pytest utils"
all = ["check_format"]


[tool.black]
line-length = 120
target-version = ['py310']
