name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Build patch
        run: uv run ./build.sh
        env:
          BAHAMUT_PASSWORD: ${{ secrets.BAHAMUT_PASSWORD }}
      - name: Run tests
        run: uv run pytest utils
      - name: Upload nightly patch artifact
        uses: actions/upload-artifact@v7
        with:
          name: bl-nightly
          path: bl.ips
