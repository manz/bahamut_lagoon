name: PR Build

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    - uses: manz/a816/actions/setup@v1.1.7

    - name: Check Python formatting, lint and types
      run: make check-python

    - id: rom
      uses: manz/a816/actions/decrypt-rom@v1.1.7
      with:
        passphrase: ${{ secrets.BAHAMUT_PASSWORD }}
        encrypted: bl.sfc.gz.gpg
        to: build/bl.sfc

    - name: Build patch
      if: steps.rom.outputs.available == 'true'
      run: uv run ./build.py

    - name: Build debug patch
      if: steps.rom.outputs.available == 'true'
      run: uv run ./build.py --debug

    - name: Run tests
      if: steps.rom.outputs.available == 'true'
      run: uv run pytest

    - if: steps.rom.outputs.available == 'true'  # build/gen, which the sources include, comes from the build
      uses: manz/a816/actions/lint@v1.1.7

    - if: steps.rom.outputs.available == 'true'
      uses: manz/a816/actions/seal@v1.1.7
      with:
        rom: build/bl.sfc
        patches: build/bl.ips

    - if: always() && steps.rom.outputs.available == 'true'
      uses: manz/a816/actions/pr-artifact@v1.1.7
      with:
        name: bl-ips
        files: build/bl.ips
        marker: BL-IPS-BUILD-COMMENT
        title: Bahamut Lagoon IPS
        outcome: ${{ job.status }}
