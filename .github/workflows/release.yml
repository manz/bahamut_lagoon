name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.14'
        enable-cache: true
    - name: Install Requirements
      run: uv sync --locked
    - name: Decrypt base ROM
      env:
        BAHAMUT_PASSWORD: ${{ secrets.BAHAMUT_PASSWORD }}
      run: |
        mkdir -p build
        gpg --quiet --batch --yes --decrypt --passphrase="$BAHAMUT_PASSWORD" bl.sfc.gz.gpg | gunzip > build/bl.sfc
    - name: Build patch
      run: uv run ./build.py
    - name: Package
      run: |
        mkdir -p dist
        cp build/bl.ips dist/
        uv run python -m utils.lisezmoi release/LISEZMOI.txt ${{ github.ref_name }} > dist/LISEZMOI.txt
        (cd dist && zip -X ../bl-fr-${{ github.ref_name }}.zip bl.ips LISEZMOI.txt)
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: Bahamut Lagoon FR ${{ github.ref_name }}
        files: bl-fr-${{ github.ref_name }}.zip
        prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
        generate_release_notes: true