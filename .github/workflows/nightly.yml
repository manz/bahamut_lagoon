name: Nightly Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: nightly

jobs:
  nightly:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - uses: manz/a816/actions/setup@v1.2.0
    - uses: manz/a816/actions/decrypt-rom@v1.2.0
      with:
        passphrase: ${{ secrets.BAHAMUT_PASSWORD }}
        encrypted: bl.sfc.gz.gpg
        to: build/bl.sfc
    - name: Build patch
      env:
        BL_VERSION: nightly-${{ github.run_number }}  # the Load screen shows it: testers quote it in bug reports
      run: uv run ./build.py
    - uses: manz/a816/actions/seal@v1.2.0
      with:
        rom: build/bl.sfc
        patches: build/bl.ips
    - uses: manz/a816/actions/nightly@v1.2.0
      with:
        files: build/bl.ips
